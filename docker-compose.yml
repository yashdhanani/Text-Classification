version: "3.8"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neuraltext_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuraltext
      POSTGRES_PASSWORD: neuraltext_secret_password
      POSTGRES_DB: neuraltext_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuraltext -d neuraltext_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Broker & Cache & Pub/Sub) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neuraltext_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-Compatible Artifact Storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: neuraltext_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── Backend FastAPI Application ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuraltext_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://neuraltext:neuraltext_secret_password@postgres:5432/neuraltext_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: miniopassword123
      JWT_SECRET_KEY: neuraltext_super_secret_jwt_key_for_production_use_only_change_me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/storage/models
      - hf_cache:/app/storage/hf_cache
      - temp_storage:/tmp/neuraltext

  # ── Celery Distributed ML Worker ────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuraltext_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q training,datasets,batch
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://neuraltext:neuraltext_secret_password@postgres:5432/neuraltext_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: miniopassword123
      JWT_SECRET_KEY: neuraltext_super_secret_jwt_key_for_production_use_only_change_me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/storage/models
      - hf_cache:/app/storage/hf_cache
      - temp_storage:/tmp/neuraltext

  # ── Next.js 14 Web Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuraltext_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_artifacts:
  hf_cache:
  temp_storage:
